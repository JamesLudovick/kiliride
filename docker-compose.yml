services:
  postgres:
    image: postgres:16-alpine
    container_name: kiliride-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kiliride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiliride_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kiliride_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kiliride} -d ${POSTGRES_DB:-kiliride_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kiliride-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
      - "5555:5555"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://kiliride:kiliride_dev_password@postgres:5432/kiliride_dev?schema=public}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-KiliRide Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@kiliride.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AdminPassword123}
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
      - api-app-node-modules:/app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm --workspace apps/api run prisma:generate && npm --workspace apps/api run start:dev"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: kiliride-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-4000}
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
      - web-app-node-modules:/app/apps/web/node_modules
    depends_on:
      - api
    command: npm --workspace apps/web run dev -- --host 0.0.0.0

volumes:
  postgres-data:
  api-node-modules:
  api-app-node-modules:
  web-node-modules:
  web-app-node-modules:
